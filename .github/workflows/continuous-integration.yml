name: 'Continuous Integration'

on:
    pull_request:
    push:
        branches: ['main']

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
    cancel-in-progress: true

jobs:
    lint:
        name: Lint
        runs-on: ubuntu-latest
        timeout-minutes: 5
        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Setup pnpm
              uses: pnpm/action-setup@v6

            - name: Setup Node
              uses: actions/setup-node@v7
              with:
                  node-version: lts/*
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Biome
              run: pnpm lint:ci

            # Same tool as release.yml, so this is the tarball that gets published
            - name: Package contents
              working-directory: packages/docs-kit
              run: npm pack --dry-run
