name: 'Release'

# Publishes @silarhi/docs-kit on a v* tag, through npm trusted publishing (OIDC, no token):
# npmjs.com → package settings → Trusted publishing → GitHub Actions, silarhi/docs-kit, release.yml
on:
    push:
        tags: ['v*']

permissions:
    contents: read

jobs:
    publish:
        name: Publish to npm
        runs-on: ubuntu-latest
        timeout-minutes: 10
        permissions:
            contents: read
            id-token: write
        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Setup Node
              uses: actions/setup-node@v7
              with:
                  node-version: lts/*
                  registry-url: 'https://registry.npmjs.org'

            - name: Check the tag matches the package version
              working-directory: packages/docs-kit
              run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"

            - name: Publish
              working-directory: packages/docs-kit
              run: npm publish
