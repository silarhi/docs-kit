name: 'Documentation Site'

# Reusable workflow: builds the Starlight site of a package (@silarhi/docs-kit) and, on the default branch,
# deploys it to GitHub Pages (https://<package>.silarhi.dev). Older majors live in the site itself
# (starlight-versions snapshots), so only the default branch ever publishes.
#
#     on:
#         pull_request:
#             paths: ['docs/**', '.github/workflows/docs.yml']
#         push:
#             branches: ['main'] # the default branch, e.g. '6.x' for a branch-per-major repository
#             paths: ['docs/**', '.github/workflows/docs.yml']
#         workflow_dispatch:
#
#     jobs:
#         docs:
#             name: Docs
#             permissions:
#                 contents: read
#                 pages: write
#                 id-token: write
#             uses: silarhi/docs-kit/.github/workflows/docs-site.yml@main
#
# The repository needs Settings → Pages → Source: "GitHub Actions" and its custom domain.

on:
    workflow_call:
        inputs:
            path:
                description: 'Folder of the documentation site'
                type: string
                default: 'docs'

permissions:
    contents: read

jobs:
    build:
        name: Build
        runs-on: ubuntu-latest
        timeout-minutes: 10
        defaults:
            run:
                working-directory: ${{ inputs.path }}
        steps:
            - name: Checkout
              uses: actions/checkout@v7
              with:
                  # "Last updated" dates come from the git history
                  fetch-depth: 0

            # The lockfile sits in the site folder or, for a workspace member (the hub), at the repository root
            - name: Locate lockfile
              id: lockfile
              working-directory: .
              env:
                  SITE_PATH: ${{ inputs.path }}
              run: |
                  for dir in "$SITE_PATH" .; do
                      if [ -f "$dir/pnpm-lock.yaml" ]; then
                          echo "dir=$dir" >> "$GITHUB_OUTPUT"
                          exit 0
                      fi
                  done
                  echo "::error::No pnpm-lock.yaml in $SITE_PATH or at the repository root"
                  exit 1

            - name: Setup pnpm
              uses: pnpm/action-setup@v6
              with:
                  # The version comes from "packageManager", next to the lockfile rather than at the repository root
                  package_json_file: ${{ steps.lockfile.outputs.dir }}/package.json

            - name: Setup Node
              uses: actions/setup-node@v7
              with:
                  node-version: lts/*
                  cache: pnpm
                  cache-dependency-path: ${{ steps.lockfile.outputs.dir }}/pnpm-lock.yaml

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Build
              run: pnpm run build

            - name: Upload site
              if: github.ref_name == github.event.repository.default_branch
              uses: actions/upload-pages-artifact@v5
              with:
                  path: ${{ inputs.path }}/dist

    deploy:
        name: Deploy
        if: github.ref_name == github.event.repository.default_branch
        needs: [build]
        runs-on: ubuntu-latest
        timeout-minutes: 10
        permissions:
            pages: write
            id-token: write
        # One deployment at a time, never cancelled half way
        concurrency:
            group: pages-${{ github.repository }}
            cancel-in-progress: false
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v5
